services:
  mcp-brreg:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp-brreg:latest
    container_name: mcp-brreg
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      TRANSPORT: http
      AUTH_TOKEN: ${AUTH_TOKEN:?set AUTH_TOKEN, e.g. AUTH_TOKEN=$(openssl rand -hex 32) docker compose up -d}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}  # Comma-separated browser origins, or * to allow any.
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
