name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, format and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Check formatting
        run: bun run format:check

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

  node-compat:
    name: Run on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # The published package runs under plain Node, so prove the compiled
      # output boots there and speaks MCP over stdio.
      - name: Smoke-test the stdio transport
        run: node scripts/smoke-stdio.mjs

  docker:
    name: Build and smoke-test the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: mcp-server-brreg:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the container
        run: |
          docker run -d --name brreg-ci -p 3000:3000 \
            -e TRANSPORT=http -e AUTH_TOKEN=ci-token \
            mcp-server-brreg:ci

      - name: Wait for the health check to pass
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' brreg-ci 2>/dev/null || echo starting)
            echo "attempt $i: $status"
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && break
            sleep 2
          done
          echo "::error::container did not become healthy"
          docker logs brreg-ci
          exit 1

      - name: Reject an unauthenticated request
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/mcp)
          echo "unauthenticated /mcp -> $code"
          [ "$code" = "401" ]

      - name: Complete an MCP handshake over Streamable HTTP
        run: |
          body='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          response=$(curl -sS -X POST http://localhost:3000/mcp \
            -H 'Authorization: Bearer ci-token' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d "$body")
          echo "$response"
          echo "$response" | grep -q 'mcp-server-brreg'

      - name: Show logs on failure
        if: failure()
        run: docker logs brreg-ci

      - name: Stop the container
        if: always()
        run: docker rm -f brreg-ci || true
