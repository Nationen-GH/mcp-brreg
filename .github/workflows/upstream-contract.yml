name: Upstream contract

# The Brreg API is a moving target: it migrated company classification from
# SN2007 to SN2025, which silently invalidated every industry code in this
# repository without any code change on our side. These tests hit the live API
# so that kind of drift shows up as a failed run rather than as wrong answers.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  contract:
    name: Verify assumptions against the live API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in step with .github/workflows/ci.yml and the Dockerfile.
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Run live contract tests
        run: bun run test:integration

      - name: Open an issue when the contract breaks
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Upstream contract tests are failing against data.brreg.no';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream',
            });
            if (existing.some((issue) => issue.title === title)) return;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['upstream'],
              body: [
                'The scheduled contract tests against the live Brreg API failed.',
                '',
                'That usually means one of the assumptions baked into this server changed upstream:',
                '- pagination is no longer zero-based',
                '- `naeringskode` no longer matches hierarchically (see `search_companies` in `src/server.ts`)',
                '- the register moved to a classification newer than the bundled `data/nace-codes-full.json`',
                '',
                `[Failed run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              ].join('\n'),
            });
