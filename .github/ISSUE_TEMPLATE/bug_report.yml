name: Bug report
description: Something in the server behaves incorrectly
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the tool name and the arguments you passed.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - stdio
        - Streamable HTTP (/mcp)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Server version
      placeholder: 1.1.0 or a commit SHA
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Server logs
      description: The server logs to stderr. Redact your AUTH_TOKEN before pasting.
      render: shell
